# Build Custio Docker image (GHCR) and rolling-restart Rails + Sidekiq on Hetzner.
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_KEY     — private key for SSH (e.g. root@204.168.133.160)
#   DEPLOY_HOST        — optional repository variable (Settings → Variables); default 204.168.133.160
#   DEPLOY_USER        — optional secret; default root
#   DEPLOY_PATH        — optional variable; default /root/chatwoot
#   GHCR_PULL_TOKEN    — optional PAT with read:packages; use if server pull is denied with GITHUB_TOKEN
#
# Packages: enable "Read and write" for GITHUB_TOKEN under Workflow permissions
# so the image can be pushed to ghcr.io/<owner>/chatwoot-custio.
#
# Server: .env + a compose file in DEPLOY_PATH (default /root/chatwoot).
# Uses docker-compose.production.yaml if present, else docker-compose.yaml.
# Optional repo variable DEPLOY_COMPOSE_FILE forces a specific filename.
# Image: deploy pins ghcr.io/<owner>/chatwoot-custio:<github.sha> via a generated compose override
# (no manual docker pull / login on the server).
#
# Push trigger: only branch named "local" (push = build + deploy to server).
# Manual runs: workflow_dispatch (any branch).

name: Custio build & deploy

on:
  push:
    branches:
      - local
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/chatwoot-custio

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Custio Docker overlay
        run: bash scripts/prepare_custio_docker_overlay.sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.custio
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          # Immutable tag for this commit (already pushed); avoids :latest drift and manual pulls.
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          IMAGE_LATEST: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/root/chatwoot' }}
          DEPLOY_COMPOSE_FILE: ${{ vars.DEPLOY_COMPOSE_FILE }}
        with:
          host: ${{ vars.DEPLOY_HOST || '204.168.133.160' }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GITHUB_TOKEN,GHCR_PULL_TOKEN,GHCR_USER,IMAGE_REF,IMAGE_LATEST,DEPLOY_PATH,DEPLOY_COMPOSE_FILE
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            COMPOSE_FILE="${DEPLOY_COMPOSE_FILE:-}"
            if [ -z "$COMPOSE_FILE" ]; then
              if [ -f docker-compose.production.yaml ]; then
                COMPOSE_FILE=docker-compose.production.yaml
              elif [ -f docker-compose.yaml ]; then
                COMPOSE_FILE=docker-compose.yaml
              else
                echo "No docker-compose.production.yaml or docker-compose.yaml in $PWD" >&2
                ls -la
                exit 1
              fi
            fi
            echo "Using compose file: $COMPOSE_FILE"
            echo "Deploy image: ${IMAGE_REF}"
            # One-time fix: server compose still references old org image (403 on pull).
            if grep -qE 'joop102030/chatwoot-custio|chatwoot/chatwoot:' "$COMPOSE_FILE" 2>/dev/null; then
              cp -a "$COMPOSE_FILE" "${COMPOSE_FILE}.bak-$(date +%Y%m%d%H%M%S)" || true
              sed -i "s|ghcr.io/joop102030/chatwoot-custio[^[:space:]]*|${IMAGE_LATEST}|g" "$COMPOSE_FILE"
              sed -i "s|chatwoot/chatwoot:[^[:space:]]*|${IMAGE_LATEST}|g" "$COMPOSE_FILE"
              echo "Updated legacy image references in $COMPOSE_FILE"
            fi
            # Prefer dedicated PAT for pulls if the default token is denied (private GHCR, org policy, etc.).
            if [ -n "${GHCR_PULL_TOKEN:-}" ]; then
              echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            else
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi
            export CHATWOOT_DOCKER_IMAGE="$IMAGE_REF"
            OVERRIDE=docker-compose.deploy.override.yml
            printf '%s\n' \
              'services:' \
              '  rails:' \
              "    image: ${IMAGE_REF}" \
              '  sidekiq:' \
              "    image: ${IMAGE_REF}" \
              > "$OVERRIDE"
            docker compose -f "$COMPOSE_FILE" up -d postgres redis
            docker compose -f "$COMPOSE_FILE" -f "$OVERRIDE" pull rails sidekiq
            docker compose -f "$COMPOSE_FILE" -f "$OVERRIDE" up -d --no-deps rails sidekiq
            docker compose -f "$COMPOSE_FILE" -f "$OVERRIDE" run --rm --no-deps rails bundle exec rails db:migrate
            echo "Deploy complete."
