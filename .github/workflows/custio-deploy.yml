# Build Custio Docker image (GHCR) and rolling-restart Rails + Sidekiq on Hetzner.
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_KEY     — private key for SSH (e.g. root@204.168.133.160)
#   DEPLOY_HOST        — optional repository variable (Settings → Variables); default 204.168.133.160
#   DEPLOY_USER        — optional secret; default root
#   DEPLOY_PATH        — optional variable; default /root/chatwoot
#
# Packages: enable "Read and write" for GITHUB_TOKEN under Workflow permissions
# so the image can be pushed to ghcr.io/<owner>/chatwoot-custio.
#
# Server must have docker-compose.production.yaml + .env in DEPLOY_PATH.
# Image is selected via CHATWOOT_DOCKER_IMAGE (set in compose).
#
# Push trigger: only branch named "local" (push = build + deploy to server).
# Manual runs: workflow_dispatch (any branch).

name: Custio build & deploy

on:
  push:
    branches:
      - local
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/chatwoot-custio

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Custio Docker overlay
        run: bash scripts/prepare_custio_docker_overlay.sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.custio
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/root/chatwoot' }}
        with:
          host: ${{ vars.DEPLOY_HOST || '204.168.133.160' }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GITHUB_TOKEN,GHCR_USER,IMAGE,DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export CHATWOOT_DOCKER_IMAGE="$IMAGE"
            docker compose -f docker-compose.production.yaml pull rails sidekiq
            docker compose -f docker-compose.production.yaml up -d --no-deps rails sidekiq
            echo "Deploy complete."
